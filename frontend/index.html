<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS — System Control AI</title>
    <meta name="description" content="JARVIS AI assistant with full PC system control — shell commands, file management, app control, and more.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <!-- ── Login Overlay ─────────────────────────────── -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <div class="login-logo">J</div>
            <h1 class="login-title">JARVIS</h1>
            <p class="login-subtitle">Identify yourself to proceed</p>
            <div id="loginError" class="login-error" style="display:none;"></div>
            <form id="loginForm" class="login-form">
                <div class="login-field">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="login-field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="loginBtn" class="login-btn">
                    <span id="loginBtnText">Access System</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-brand">
            <div class="header-logo">J</div>
            <span class="header-title">JARVIS</span>
        </div>
        <div class="header-status">
            <button class="voice-toggle" id="voiceToggle" onclick="toggleVoice()">🔊 Voice: OFF</button>
            <div class="status-dot"></div>
            <button class="logout-btn" onclick="logout()">Logout</button>
            <span>System Control Active</span>
        </div>
    </header>

    <!-- Chat area -->
    <div class="chat-container" id="chatContainer">
        <!-- Welcome screen (shown initially) -->
        <div class="welcome" id="welcomeScreen">
            <div class="welcome-icon">⚡</div>
            <h2>JARVIS Online</h2>
            <p>I have full control over your PC. I can run commands, manage files, open apps, take screenshots, control volume, and much more.</p>
            <div class="quick-actions">
                <button class="quick-action" onclick="sendQuick('What\'s my CPU and RAM usage?')">💻 System Stats</button>
                <button class="quick-action" onclick="sendQuick('Open Notepad')">📝 Open Notepad</button>
                <button class="quick-action" onclick="sendQuick('List all files on my Desktop')">📁 Desktop Files</button>
                <button class="quick-action" onclick="sendQuick('Take a screenshot')">📸 Screenshot</button>
                <button class="quick-action" onclick="sendQuick('What\'s the current volume level?')">🔊 Volume</button>
                <button class="quick-action" onclick="sendQuick('Search the web for latest AI news')">🌐 Web Search</button>
            </div>
        </div>
    </div>

    <!-- Input bar -->
    <div class="input-bar">
        <div class="input-wrapper">
            <input type="text" id="queryInput" placeholder="Ask Jarvis anything... (system commands, file ops, web search, etc.)"
                   autocomplete="off" autofocus>
            <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="Dictate via Microphone">🎙️</button>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="/frontend/app.js"></script>
</body>
</html>
